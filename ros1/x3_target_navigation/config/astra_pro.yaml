rgbd_target_node:
  rgb_topic: /camera/rgb/image_inference
  depth_topic: /camera/depth_registered/image_raw
  camera_info_topic: /camera/rgb/camera_info
  map_frame: map
  # Override from the launch argument target_label without editing this file.
  target_label: bottle
  confidence_threshold: 0.08
  nms_threshold: 0.45
  external_focus: true
  min_depth_m: 0.25
  max_depth_m: 3.00
  depth_roi_scale: 0.40
  min_depth_valid_ratio: 0.50
  # Jetson OpenCV 4.1 CPU inference is about 2.3-3.2 s per frame.
  max_observation_age_sec: 4.00
  tf_timeout_sec: 0.20
  # AMCL can lag the image stamp by a few seconds while the pose itself is still valid.
  tf_future_tolerance_sec: 5.0

target_fusion_node:
  # Partial occlusion can produce intermittent valid frames. Three samples
  # are enough when the obstacle-facing surface remains consistent.
  min_samples: 3
  max_samples: 12
  # Five throttled static-target samples need about 20-25 s on this Jetson.
  max_age_sec: 30.00
  outlier_distance_m: 0.22
  max_stddev_m: 0.08

target_task_manager:
  # Function 1: straight approach, stop command at measured front gap <= 5 cm.
  obstacle_stop_approach: true
  obstacle_stop_distance_m: 0.05
  approach_speed_mps: 0.04
  # Function 2 is opt-in through obstacle_bypass:=true.
  bypass_clearance_m: 0.05
  # Function 2: approach the frozen bottle goal; stop at front gap <= 5 cm,
  # then select and validate a side route after stopped odometry is confirmed.
  bypass_detection_distance_m: 0.05
  bypass_max_shift_m: 0.45
  map_frame: map
  # Refuse short-range execution while AMCL position uncertainty is larger
  # than the parking distance budget.
  max_pose_std_m: 0.15
  target_max_age_sec: 10.00
  # CPU inference takes about 3 s, and a transparent bottle can miss depth
  # for several frames while RGB still sees it. Keep the goal while either a
  # fresh fused target or a fresh RGB detection is arriving.
  target_loss_timeout_sec: 15.00
  parking_clearance_m: 0.12
  clearance_min_m: 0.10
  clearance_max_m: 0.20
  footprint_front_m: 0.117
  footprint_half_width_m: 0.100
  depth_error_m: 0.03
  braking_distance_m: 0.03
  obstacle_margin_m: 0.10
  obstacle_bearing_half_angle_rad: 0.35
  trans_stopped_vel: 0.003
  theta_stopped_vel: 0.01
  stop_confirmation_timeout_sec: 2.00
  # RGB-only arrival evidence may finish after slow Jetson CPU inference.
  # Navigation goal generation still always requires stable RGB-D depth.
  visual_max_age_sec: 10.00
  # Distance from the bottle to base_footprint. The front edge is 0.117 m
  # ahead of that point, so 0.167 m leaves a 5 cm gap in front of the bumper.
  # The goal tolerance must stay inside that gap or the body can reach the bottle.
  # Legacy compatibility field; parking uses the surface-clearance sum.
  standoff_m: 0.30
  standoff_tolerance_m: 0.04
  min_travel_m: 0.10
  max_travel_m: 0.80
  plan_tolerance_m: 0.05
  target_drift_tolerance_m: 0.15
  navigation_timeout_sec: 120.0
  verification_timeout_sec: 15.0
  # Confirm stays closed until the chassis, lidar, cameras, TF and AMCL pass.
  voltage_topic: /voltage
  edition_topic: /edition
  scan_topic: /scan
  rgb_topic: /camera/rgb/image_raw
  depth_topic: /camera/depth_registered/image_raw
  camera_frame: camera_rgb_optical_frame
  min_voltage_v: 10.0
  max_voltage_v: 13.5
  min_edition: 1.0
  min_scan_hz: 5.0
  sensor_timeout_sec: 1.0
