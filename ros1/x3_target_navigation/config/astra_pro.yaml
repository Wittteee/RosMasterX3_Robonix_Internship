rgbd_target_node:
  rgb_topic: /camera/rgb/image_inference
  depth_topic: /camera/depth_registered/image_raw
  camera_info_topic: /camera/rgb/camera_info
  map_frame: map
  # The white cylinder alternates between bottle and cup scores around 0.05-0.17.
  target_label: bottle
  confidence_threshold: 0.08
  nms_threshold: 0.45
  external_focus: true
  min_depth_m: 0.25
  max_depth_m: 3.00
  depth_roi_scale: 0.40
  min_depth_valid_ratio: 0.50
  # Jetson OpenCV 4.1 CPU inference is about 2.3-3.2 s per frame.
  max_observation_age_sec: 4.00
  tf_timeout_sec: 0.20

target_fusion_node:
  min_samples: 5
  max_samples: 12
  # Five throttled static-target samples need about 20-25 s on this Jetson.
  max_age_sec: 30.00
  outlier_distance_m: 0.15
  max_stddev_m: 0.04

target_task_manager:
  map_frame: map
  # Refuse short-range execution while AMCL position uncertainty is larger
  # than the parking distance budget.
  max_pose_std_m: 0.15
  target_max_age_sec: 10.00
  # CPU inference takes about 3 s, and a transparent bottle can miss depth
  # for several frames while RGB still sees it. Keep the goal while either a
  # fresh fused target or a fresh RGB detection is arriving.
  target_loss_timeout_sec: 15.00
  # RGB-only arrival evidence may finish after slow Jetson CPU inference.
  # Navigation goal generation still always requires stable RGB-D depth.
  visual_max_age_sec: 10.00
  # Distance from the bottle to base_footprint. The front edge is 0.117 m
  # ahead of that point, so 0.167 m leaves a 5 cm gap in front of the bumper.
  # The goal tolerance must stay inside that gap or the body can reach the bottle.
  standoff_m: 0.167
  standoff_tolerance_m: 0.04
  min_travel_m: 0.10
  max_travel_m: 0.80
  plan_tolerance_m: 0.05
  target_drift_tolerance_m: 0.15
  navigation_timeout_sec: 120.0
  verification_timeout_sec: 15.0
